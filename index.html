<style>
/* Layout: una sola columna tipo app de iPhone; título grande, listas agrupadas, barra inferior con + central */
:root{
  --bg:#F4F4F7; --surface:#FFFFFF; --text:#111114; --sub:#6E6E78; --faint:#A6A6B0; --line:#E8E8ED;
  --fill:#E4E4EA; --fill2:#F0F0F4; --primary:#0F766E; --primary-soft:#CCFBF1; --accent:#14B8A6; --on-accent:#04211D;
  --now:#1C1C1F; --on-now:#FFFFFF; --ok-bg:#DCFCE7; --ok:#14532D; --ko-bg:#FDE8E9; --ko:#9F1239; --warn:#B45309; --warn-bg:#FEF3C7;
  --nav:rgba(250,250,252,.92); --scrim:rgba(10,10,12,.38); --mint:#5EEAD4;
  --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E10; --surface:#1A1A1D; --text:#F4F4F6; --sub:#9A9AA4; --faint:#5E5E68; --line:#2A2A2F;
  --fill:#2C2C32; --fill2:#232327; --primary:#2DD4BF; --primary-soft:#123F3A; --accent:#14B8A6; --on-accent:#04211D;
  --now:#26262B; --on-now:#FFFFFF; --ok-bg:#12351F; --ok:#86EFAC; --ko-bg:#3F1720; --ko:#FDA4AF; --warn:#F59E0B; --warn-bg:#3A2A0C;
  --nav:rgba(22,22,25,.9); --scrim:rgba(0,0,0,.55); --mint:#5EEAD4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#1A1A1D; --text:#F4F4F6; --sub:#9A9AA4; --faint:#5E5E68; --line:#2A2A2F;
  --fill:#2C2C32; --fill2:#232327; --primary:#2DD4BF; --primary-soft:#123F3A; --accent:#14B8A6; --on-accent:#04211D;
  --now:#26262B; --on-now:#FFFFFF; --ok-bg:#12351F; --ok:#86EFAC; --ko-bg:#3F1720; --ko:#FDA4AF; --warn:#F59E0B; --warn-bg:#3A2A0C;
  --nav:rgba(22,22,25,.9); --scrim:rgba(0,0,0,.55); --mint:#5EEAD4; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}
#app.withnow{padding-bottom:calc(184px + env(safe-area-inset-bottom,0px))}
.top{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--sub)}
.eyebrow::first-letter{text-transform:uppercase}
.trow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em;text-wrap:balance;min-width:0}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.acts{display:flex;gap:8px;flex:none}
.circ{width:38px;height:38px;border-radius:999px;border:0;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text)}
.circ svg{width:20px;height:20px}
.back{border:0;background:none;color:var(--primary);font-size:17px;font-weight:500;display:flex;align-items:center;gap:2px;height:44px;padding:0 4px 0 0;margin-left:-6px}
.stack{display:flex;flex-direction:column;gap:22px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--primary);font-size:15px;font-weight:600;padding:6px 0}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}

.hero{border:0;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.hero .hl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lab{font-size:13px;font-weight:600;color:var(--sub)}
.big{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.big.ko{color:var(--ko)}
.hsub{font-size:13px;color:var(--sub)}
.hwarn{font-size:13px;font-weight:600;color:var(--warn)}
.ring{flex:none;width:88px;height:88px}
.shelf{display:flex;gap:14px;overflow-x:auto;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:2px max(20px,env(safe-area-inset-left,0px)) 6px;scroll-snap-type:x mandatory;scroll-padding-inline:max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.cover{flex:none;width:132px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;scroll-snap-align:start}
.cv{position:relative;width:132px;height:132px;border-radius:14px;background:var(--c);color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.18))}
.cv b{position:relative;z-index:1;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cv .g{position:absolute;z-index:1;top:9px;right:9px;font-size:13px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.28);color:#fff;font-variant-numeric:tabular-nums}
.cover .n{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover .m{font-size:12px;color:var(--sub);margin-top:-5px}
.cover.add .cv{background:var(--fill);color:var(--sub);align-items:center;justify-content:center}
.cover.add .cv::after{display:none}
.group{background:var(--surface);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.row{border:0;background:none;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--line)}
.row.plain + .row.plain::before{left:14px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{font-size:13px;font-weight:600;color:var(--sub);flex:none}
.row.hl{animation:pop .5s ease;background:var(--primary-soft)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
.chev{flex:none;color:var(--faint)}
.dt{flex:none;width:42px;height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--tint,var(--fill2));color:var(--ink,var(--text))}
.dt small{font-size:10px;font-weight:700;text-transform:uppercase}
.dt span{font-size:17px;font-weight:800}
.dot{width:10px;height:10px;border-radius:999px;flex:none;background:var(--c)}
.sq{flex:none;width:42px;height:42px;border-radius:10px;background:var(--c);color:#fff;display:flex;align-items:flex-end;padding:5px;font-size:11px;font-weight:800}
.pill{flex:none;font-size:15px;font-weight:800;padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.ko{background:var(--ko-bg);color:var(--ko)}
.pill.no{background:var(--fill2);color:var(--sub);font-weight:600;font-size:13px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--primary-soft);color:var(--primary);flex:none}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.check{flex:none;width:26px;height:26px;border-radius:999px;border:2px solid var(--faint);background:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.done .t{text-decoration:line-through;color:var(--sub)}
.btn{height:52px;border-radius:999px;border:0;padding:0 24px;font-size:16px;font-weight:700;background:var(--fill);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:800}
.btn.dan{background:none;color:var(--ko)}
.btns{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--sub);padding:0 4px;margin:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 8px}
.empty .ic{width:112px;height:112px;border-radius:32px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.empty p{margin:0;max-width:290px;color:var(--sub);font-size:16px;line-height:1.45}
.empty .btn{width:auto}
/* Asignatura */
.dhero{border-radius:22px;background:var(--c);color:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(0,0,0,.22));pointer-events:none}
.dhero > *{position:relative;z-index:1}
.dhero .ab{font-size:13px;font-weight:800;letter-spacing:.06em;opacity:.85}
.dhero .nm{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dhero .gr{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.dhero .ln{font-size:14px;opacity:.92}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--surface);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
/* Horario */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.days button{border:0;background:var(--surface);border-radius:14px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.days small{font-size:12px;font-weight:600;color:var(--sub)}
.days span{font-size:19px;font-weight:800}
.days button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.75}
.days button.today span{color:var(--primary)}
.days button[aria-pressed="true"].today span{color:var(--mint)}
.blk{border:0;width:100%;text-align:left;display:flex;gap:12px;align-items:stretch;background:var(--surface);border-radius:16px;padding:12px 14px}
.blk .bar{width:5px;border-radius:3px;background:var(--c);flex:none}
.blk .tm{flex:none;width:52px;display:flex;flex-direction:column;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.blk .tm span:last-child{color:var(--sub);font-weight:500}
.blk.now{background:var(--now);color:var(--on-now)}
.blk.now .tm span:last-child,.blk.now .s{color:rgba(255,255,255,.7)}
.blk .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.blk .t{font-size:16px;font-weight:700}
.blk .s{font-size:13px;color:var(--sub)}
.brk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);padding:0 4px}
.brk::before,.brk::after{content:"";height:1px;flex:1;background:var(--line)}
.wk{overflow-x:auto;background:var(--surface);border-radius:16px;padding:10px}
.wk table{border-collapse:separate;border-spacing:4px;width:100%;min-width:330px;table-layout:fixed}
.wk th{font-size:12px;font-weight:700;color:var(--sub);padding:2px 0}
.wk th.tcol{width:44px}
.wk td.tt{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;padding-right:2px;line-height:1.15}
.wk td button{width:100%;height:40px;border:0;border-radius:8px;background:var(--fill2);font-size:11px;font-weight:800;color:var(--faint);padding:0}
.wk td button.f{background:var(--c);color:#fff}
.wk td.off{background:none}
.wk tr.brow td{height:10px;padding:0}
/* Calendario */
.cal{background:var(--surface);border-radius:18px;padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.calh b{font-size:17px;font-weight:800;text-transform:capitalize}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.calg .wd{font-size:11px;font-weight:700;color:var(--sub);text-align:center;padding:4px 0}
.calg button{border:0;background:none;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.calg button.out{color:var(--faint)}
.calg button.hol{color:var(--warn)}
.calg button.td{color:var(--primary);font-weight:800}
.calg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.calg .ds{display:flex;gap:2px;height:5px}
.calg .ds i{width:5px;height:5px;border-radius:999px;background:var(--c)}
/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);padding:0;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--text);font-weight:700}
nav.tabs svg{width:26px;height:26px}

nav.tabs .plus span{width:58px;height:58px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:4px solid var(--bg);box-shadow:0 6px 16px rgba(20,184,166,.35)}
#now{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;max-width:616px;margin:0 auto;border:0;text-align:left;background:var(--now);color:var(--on-now);border-radius:14px;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;overflow:hidden}
#now .sq{width:34px;height:34px;font-size:10px;border-radius:8px}
#now .tx{flex:1;min-width:0;display:flex;flex-direction:column}
#now .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .s{font-size:12px;opacity:.7}
button:focus:not(:focus-visible){outline:none}
#snack{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;max-width:616px;margin:0 auto;background:#1C1C1F;color:#fff;border-radius:14px;min-height:56px;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
#snack.on{transform:none;opacity:1;pointer-events:auto}
#snack .ok{width:28px;height:28px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
#snack .m{flex:1;font-size:15px;font-weight:600}
#snack button{height:44px;padding:0 14px;border:0;background:none;color:#5EEAD4;font-size:15px;font-weight:700}
/* Hojas */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet{width:100%;max-width:640px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease}
.sh-h{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px 4px}
.sh-h .grab{grid-column:1/4;justify-self:center;width:38px;height:5px;border-radius:3px;background:var(--fill);margin-bottom:6px}
.sh-h button{justify-self:start;border:0;background:none;color:var(--primary);font-size:16px;font-weight:500;height:44px;padding:0 8px}
.sh-h b{font-size:16px;font-weight:700;text-align:center}
.sh-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sh-b > *{flex-shrink:0}
.sh-f{flex:none;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > label,.flab{padding-left:16px;font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.in{height:50px;padding:0 16px;border:0;border-radius:14px;background:var(--surface);font-size:17px;width:100%;min-width:0}

.form{background:var(--surface);border-radius:14px;display:flex;flex-direction:column}
.fr{min-height:52px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:10px;font-size:16px;position:relative}
.fr + .fr::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.fr > label,.fr > span:first-child{flex:1;min-width:0}
.fr .in{height:38px;background:var(--fill2);border-radius:9px;font-size:16px;width:auto;max-width:58%;padding:0 10px;text-align:right}
.fr select.in{text-align:left;padding-right:32px;background-position:right 10px center}
.fr input[type=date].in,.fr input[type=time].in{text-align:center;min-width:120px}
.fr .num{width:84px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios button{height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600}
.radios button[aria-checked="true"]{background:var(--text);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles button{height:96px;border:0;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700}
.tiles svg{width:28px;height:28px;color:var(--primary)}

<script>
"use strict";
// ======================= Datos (mismo formato que la app de Android) =======================
const NORMAL=0, MEDIA=1, SUBIR=2, RECU=3, ALL=-1, DAYS=5, SLOTS=12;
const COLORS=[0xFF3B6FE0,0xFF2E9E6A,0xFFE0534A,0xFF8B5CF6,0xFFF08C2E,0xFF14A3A3,0xFF5B5FC7,0xFFDB4C8A,0xFF8D6E63,0xFF607D8B].map(c=>c|0);
const SEED=["Sistemas operativos en red","Seguridad informática","Servicios en red","Aplicaciones web","Empresa e iniciativa emprendedora"];
const DAY_NAMES=["Lunes","Martes","Miércoles","Jueves","Viernes"], DAY_SHORT=["L","M","X","J","V"];
const WD=["dom","lun","mar","mié","jue","vie","sáb"], MON=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const SHARE_TAG="#MISEXAMENES:";
let D=null;

const pad=n=>(n<10?"0":"")+n;
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};
const today=()=>iso(new Date());
const toMin=s=>{const m=/^\s*(\d{1,2}):(\d{2})/.exec(s||"");return m?(+m[1])*60+(+m[2]):-1;};
const fromMin=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+":"+pad(m%60);};
const hex=c=>"#"+(((c>>>0)&0xFFFFFF).toString(16).padStart(6,"0"));
const toColor=h=>(0xFF000000|parseInt(h.slice(1),16))|0;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{v=String(v==null?"":v).trim().replace(",",".").replace("%","").trim();if(!v)return null;const n=Number(v);return isFinite(n)?n:NaN;};
const fmt=g=>String(Math.round(g*100)/100).replace(".",",");
const fmt1=g=>(Math.round(g*10)/10).toFixed(1).replace(".",",");
const fmtPct=w=>String(Math.round(w*10)/10).replace(".",",");

function blankData(){
  return {version:4,nextId:1,subjects:[],exams:[],trimesters:[],schedule:Array.from({length:DAYS},()=>Array(SLOTS).fill(0)),
    times:{from:[],to:[],breakAfter:0,breakFrom:"",breakTo:"",daySlots:[7,7,7,7,6]},tasks:[],holidays:[]};
}
function generateTimes(d,start,minutes,count,breakAfter,breakMin){
  count=Math.max(1,Math.min(SLOTS,count|0));minutes=Math.max(5,minutes|0);
  let t=toMin(start);if(t<0)t=8*60+30;
  const T=d.times;T.from=[];T.to=[];
  T.breakAfter=breakAfter>0&&breakAfter<count&&breakMin>0?breakAfter:0;T.breakFrom="";T.breakTo="";
  for(let i=0;i<count;i++){
    if(T.breakAfter>0&&i===T.breakAfter){T.breakFrom=fromMin(t);t+=breakMin;T.breakTo=fromMin(t);}
    T.from[i]=fromMin(t);t+=minutes;T.to[i]=fromMin(t);
  }
  for(let k=0;k<DAYS;k++)T.daySlots[k]=Math.min(T.daySlots[k]<=0?count:T.daySlots[k],count);
}
function defaultTimes(d){d.times.daySlots=[7,7,7,7,6];generateTimes(d,"8:30",50,7,3,20);}
function seedTrims(d){
  const n=new Date();const y=n.getMonth()>=7?n.getFullYear():n.getFullYear()-1;
  addTrim(d,"1er trimestre",y+"-09-08",y+"-12-22");
  addTrim(d,"2º trimestre",(y+1)+"-01-07",(y+1)+"-03-26");
  addTrim(d,"3er trimestre",(y+1)+"-04-06",(y+1)+"-06-23");
}
function addTrim(d,name,start,end){d.trimesters.push({id:d.nextId++,name,start,end});d.trimesters.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);}
function newData(){
  const d=blankData();defaultTimes(d);
  SEED.forEach((n,i)=>d.subjects.push({id:d.nextId++,name:n,color:COLORS[i%COLORS.length],abbr:"",teacher:"",contact:"",official:{}}));
  seedTrims(d);return d;
}
/** Lee una copia (de Android o de aquí) igual que Data.fromJson. */
function normalize(r){
  if(!r||typeof r!=="object"||!Array.isArray(r.subjects))throw new Error("formato");
  const d=blankData();let next=+r.nextId||1;const bump=id=>{next=Math.max(next,id+1);};
  for(const o of r.subjects){const id=+o.id;if(!isFinite(id))continue;
    const s={id,name:String(o.name||""),color:(+o.color||COLORS[0])|0,abbr:String(o.abbr||""),teacher:String(o.teacher||""),contact:String(o.contact||""),official:{}};
    if(o.weight!=null&&isFinite(+o.weight)&&+o.weight>=0)s.weight=+o.weight;
    if(o.official&&typeof o.official==="object")for(const k in o.official){const v=+o.official[k];if(isFinite(v)&&isFinite(+k))s.official[String(+k)]=v;}
    d.subjects.push(s);bump(id);}
  const has=id=>d.subjects.some(s=>s.id===id);
  for(const o of (r.exams||[])){const id=+o.id;if(!isFinite(id))continue;
    d.exams.push({id,subjectId:+o.subjectId,title:String(o.title||""),date:String(o.date||""),topics:String(o.topics||""),
      grade:o.grade==null||!isFinite(+o.grade)?-1:+o.grade,weight:isFinite(+o.weight)?+o.weight:0,type:+o.type||0,linkId:+o.linkId||0,trimId:+o.trimId||0});bump(id);}
  if(Array.isArray(r.trimesters)){for(const o of r.trimesters){const id=+o.id;d.trimesters.push({id,name:String(o.name||""),start:String(o.start||""),end:String(o.end||"")});bump(id);}
    d.trimesters.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);}
  for(const o of (r.tasks||[])){const id=+o.id;if(!has(+o.subjectId))continue;
    d.tasks.push({id,subjectId:+o.subjectId,title:String(o.title||""),due:String(o.due||""),notes:String(o.notes||""),done:!!o.done});bump(id);}
  for(const o of (r.holidays||[])){const id=+o.id;d.holidays.push({id,name:String(o.name||""),start:String(o.start||""),end:String(o.end||"")});bump(id);}
  d.holidays.sort((a,b)=>a.start<b.start?-1:1);
  d.nextId=next;
  defaultTimes(d);
  const t=r.times;
  if(t&&Array.isArray(t.from)&&Array.isArray(t.to)&&t.from.length>0&&t.from.length===t.to.length&&t.from.length<=SLOTS){
    d.times.from=t.from.map(String);d.times.to=t.to.map(String);
    let ba=+t.breakAfter||0;if(ba<0||ba>=d.times.from.length)ba=0;d.times.breakAfter=ba;
    d.times.breakFrom=String(t.breakFrom||"");d.times.breakTo=String(t.breakTo||"");
    for(let k=0;k<DAYS;k++){const v=Array.isArray(t.daySlots)&&k<t.daySlots.length?+t.daySlots[k]:d.times.from.length;d.times.daySlots[k]=isFinite(v)?v:d.times.from.length;}
  }
  if(!Array.isArray(r.trimesters))seedTrims(d);
  if(Array.isArray(r.schedule))for(let k=0;k<Math.min(DAYS,r.schedule.length);k++){const row=r.schedule[k];if(!Array.isArray(row))continue;
    for(let s=0;s<Math.min(SLOTS,row.length);s++){const id=+row[s]||0;d.schedule[k][s]=has(id)?id:0;}}
  return d;
}
function toJson(d){
  return {version:4,nextId:d.nextId,
    subjects:d.subjects.map(s=>{const o={id:s.id,name:s.name,color:s.color,abbr:s.abbr,teacher:s.teacher,contact:s.contact,official:s.official};if(s.weight!=null&&s.weight>=0)o.weight=s.weight;return o;}),
    exams:d.exams,trimesters:d.trimesters,schedule:d.schedule,times:d.times,tasks:d.tasks,holidays:d.holidays};
}

// ---------- Cálculos (copiados de Data.java) ----------
const subject=id=>D.subjects.find(s=>s.id===id)||null;
const exam=id=>D.exams.find(e=>e.id===id)||null;
const trim=id=>D.trimesters.find(t=>t.id===id)||null;
const slots=()=>D.times.from.length;
const slotsFor=d=>Math.max(0,Math.min(D.times.daySlots[d],slots()));
const sw=s=>s.weight!=null&&s.weight>=0?s.weight:-1;
function trimForDate(date){return D.trimesters.find(t=>date>=t.start&&date<=t.end)||null;}
function trimOf(e){if(e.trimId>0){const t=trim(e.trimId);if(t)return t;}return e.date?trimForDate(e.date):null;}
function inTrim(e,tid){if(tid===ALL)return true;const t=trimOf(e);return !!t&&t.id===tid;}
function holidayFor(date){return D.holidays.find(h=>date>=h.start&&date<=(h.end||h.start))||null;}
function effGrade(e){if(!(e.grade>=0))return -1;let g=e.grade;for(const x of D.exams)if(x.type===SUBIR&&x.linkId===e.id&&x.grade>=0&&x.grade>g)g=x.grade;return g;}
function rootOf(e){let cur=e,guard=0;while(cur.type===MEDIA&&guard++<50){const p=exam(cur.linkId);if(!p||p.subjectId!==e.subjectId||p.id===cur.id)break;cur=p;}return cur;}
function recuGrade(sid,tid){let r=-1;for(const x of D.exams)if(x.subjectId===sid&&x.type===RECU&&x.linkId===tid&&x.grade>=0&&x.grade>r)r=x.grade;return r;}
function stats(sid,tid=ALL){
  const st={avg:-1,finalAvg:-1,totalW:0,gradedW:0,needed:NaN,equalWeights:false,exams:0,graded:0,simpleAvg:-1,official:-1,calcFinal:-1,beforeRecu:-1,recu:-1,recovered:false};
  const groups=new Map();
  for(const e of D.exams){if(e.subjectId!==sid||!inTrim(e,tid))continue;st.exams++;if(e.grade>=0)st.graded++;if(e.type===SUBIR||e.type===RECU)continue;
    const r=rootOf(e).id;if(!groups.has(r))groups.set(r,[]);groups.get(r).push(e);}
  let declared=0;for(const r of groups.keys())declared+=Math.max(0,exam(r).weight||0);
  st.totalW=declared;st.equalWeights=declared<=0&&groups.size>0;
  let sS=0,sN=0;for(const gl of groups.values())for(const e of gl){const g=effGrade(e);if(g>=0){sS+=g;sN++;}}
  if(sN>0)st.simpleAvg=sS/sN;
  // En el curso, un trimestre recuperado cuenta con la nota de la recuperación
  const recG=new Map(),recW=new Map();
  if(tid===ALL)for(const t of D.trimesters){const ts=stats(sid,t.id);if(ts.recovered)recG.set(t.id,ts.recu);}
  let total=0,graded=0,sum=0;
  for(const [rid,gl] of groups){const w=st.equalWeights?1:Math.max(0,exam(rid).weight||0);
    if(recG.size){const rt=trimOf(exam(rid));if(rt&&recG.has(rt.id)){recW.set(rt.id,(recW.get(rt.id)||0)+w);continue;}}
    total+=w;let gs=0,n=0;
    for(const e of gl){const g=effGrade(e);if(g>=0){gs+=g;n++;}}if(n>0){graded+=w;sum+=w*(gs/n);}}
  for(const [t,w] of recW){total+=w;graded+=w;sum+=w*recG.get(t);}
  if(graded>0)st.avg=sum/graded;
  st.gradedW=st.equalWeights?(total>0?graded/total*100:0):graded;
  if(total>graded&&total>0)st.needed=(5*total-sum)/(total-graded);
  st.finalAvg=st.avg;
  if(tid===ALL)for(const x of D.exams)if(x.subjectId===sid&&x.type===SUBIR&&!x.linkId&&x.grade>=0&&x.grade>st.finalAvg)st.finalAvg=x.grade;
  st.beforeRecu=st.finalAvg;
  if(tid!==ALL){st.recu=recuGrade(sid,tid);if(st.recu>=0&&st.recu>st.finalAvg){st.finalAvg=st.recu;st.recovered=true;}}
  st.calcFinal=st.finalAvg;
  const s=subject(sid);if(s){const off=s.official[String(tid)];if(off!=null&&off>=0){st.official=off;st.finalAvg=off;}}
  return st;
}
function hoursOf(sid){let h=0;for(let d=0;d<DAYS;d++)for(let s=0;s<slotsFor(d);s++)if(D.schedule[d][s]===sid)h++;return h;}
const manualWeights=()=>D.subjects.some(s=>sw(s)>=0);
function hoursShare(sid){let t=0;for(const s of D.subjects)t+=hoursOf(s.id);return t===0?-1:100*hoursOf(sid)/t;}
function overall(tid){
  const o={avg:-1,simple:-1,withGrade:0,passed:0,hours:0,byHours:false,manual:manualWeights(),missingWeight:0};
  let sW=0,sGW=0,sG=0;
  for(const s of D.subjects){const g=stats(s.id,tid).finalAvg;const h=hoursOf(s.id);o.hours+=h;if(g<0)continue;
    o.withGrade++;if(g>=5)o.passed++;sG+=g;let w;if(o.manual){if(sw(s)<0)o.missingWeight++;w=Math.max(0,sw(s));}else w=h;sW+=w;sGW+=g*w;}
  if(o.withGrade===0)return o;o.simple=sG/o.withGrade;
  if(sW>0){o.avg=sGW/sW;o.byHours=true;}else o.avg=sG/o.withGrade;
  return o;
}
function abbr(s){
  if(s.abbr&&s.abbr.trim())return s.abbr.trim().toUpperCase().slice(0,4);
  const w=s.name.split(/\s+/).filter(x=>x.length>2&&!/^(del|las|los|para|con|por)$/i.test(x));
  if(w.length>=2)return w.slice(0,3).map(x=>x[0]).join("").toUpperCase();
  return (w[0]||s.name||"?").slice(0,3).toUpperCase();
}
const slotAt=m=>{for(let i=0;i<slots();i++){const a=toMin(D.times.from[i]),b=toMin(D.times.to[i]);if(a>=0&&b>a&&m>=a&&m<b)return i;}return -1;};
function blocks(di){
  const out=[];const n=slotsFor(di);
  for(let s=0;s<n;s++){const id=D.schedule[di][s];if(!id)continue;const last=out[out.length-1];
    const contig=last&&last.id===id&&last.to===s-1&&!(D.times.breakAfter>0&&s===D.times.breakAfter);
    if(contig)last.to=s;else out.push({id,from:s,to:s});}
  return out;
}

// ======================= Guardado =======================
const LS="misexamenes-datos";
let lastLocal=0;
function readLocal(){try{const s=localStorage.getItem(LS);if(s){const o=JSON.parse(s);return o&&o.json?o:null;}}catch(e){}return null;}
function saveLocal(){
  const json=JSON.stringify(toJson(D));lastLocal=Date.now();
  try{localStorage.setItem(LS,JSON.stringify({json,updated:lastLocal}));}catch(e){}
}
function save(){
  saveLocal();
  if(SYNC){editSeq++;SYNC.dirty=true;saveSync();clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),1500);}
}

// ======================= Sincronizar con el Android (sync.php en esta web) =======================
const SY="misexamenes-sync";
let SYNC=null,editSeq=0,syncBusy=false,syncAgain=false,pushT=0;
try{SYNC=JSON.parse(localStorage.getItem(SY)||"null");if(SYNC&&!/^[A-Za-z0-9]{16,64}$/.test(SYNC.code||""))SYNC=null;}catch(e){SYNC=null;}
function saveSync(){try{if(SYNC)localStorage.setItem(SY,JSON.stringify(SYNC));else localStorage.removeItem(SY);}catch(e){}}
const appBase=()=>new URL("./",location.href).href.split("#")[0];
const syncLink=()=>appBase()+"#sync="+SYNC.code;
function newCode(){const abc="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";const r=new Uint32Array(24);crypto.getRandomValues(r);return Array.from(r,x=>abc[x%abc.length]).join("");}
async function api(code,body){
  const r=await fetch(appBase()+"sync.php?c="+code,{method:body?"POST":"GET",cache:"no-store",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  if(r.status!==200&&r.status!==409)throw new Error("http "+r.status);
  const o=await r.json();return {status:r.status,updated:+o.updated||0,json:typeof o.json==="string"?o.json:null};
}
function refreshSync(){if(SH&&SH.isSettings)settingsSheet();else if(!SH&&!S.detail&&S.tab==="inicio")render();}
async function syncNow(manual){
  if(!SYNC)return;if(syncBusy){syncAgain=true;return;}syncBusy=true;
  const code=SYNC.code,base=SYNC.base||0,dirty=!!SYNC.dirty,seq=editSeq,json=JSON.stringify(toJson(D));
  let r=null,posted=false;
  try{r=await api(code);if(dirty&&(r.updated===base||r.updated===0)){r=await api(code,{base,json,force:false});posted=true;}}catch(e){r=null;}
  syncBusy=false;
  if(SYNC&&SYNC.code===code){
    if(!r){SYNC.err=true;if(manual)snack("Sin conexión. Se sincroniza cuando vuelva internet");}
    else{SYNC.err=false;SYNC.last=Date.now();
      if(r.status===409)syncConflict(r);
      else if(posted){SYNC.base=r.updated;if(seq===editSeq)SYNC.dirty=false;if(manual)snack("Sincronizado");}
      else if(r.updated!==base&&r.json){if(!dirty)applyRemote(r);else syncConflict(r);}
      else if(manual)snack("Ya estaba todo al día");}
    saveSync();refreshSync();
  }
  if(syncAgain){syncAgain=false;syncNow(false);}
}
function applyRemote(r){
  let d;try{d=normalize(JSON.parse(r.json));}catch(e){return snack("Los datos de la nube no son válidos");}
  try{localStorage.setItem("misexamenes-antes-sync",JSON.stringify(toJson(D)));}catch(e){}
  D=d;editSeq++;SYNC.base=r.updated;SYNC.dirty=false;saveSync();saveLocal();
  if(S.detail&&!subject(S.detail))S.detail=0;if(S.period!==ALL&&!trim(S.period))S.period=ALL;
  if(!SH)render();snack("Datos al día con la nube");
}
async function forcePush(base,msg){
  if(!SYNC)return;const seq=editSeq,code=SYNC.code;syncBusy=true;
  let r=null;try{r=await api(code,{base,json:JSON.stringify(toJson(D)),force:true});}catch(e){r=null;}
  syncBusy=false;if(!SYNC||SYNC.code!==code)return;
  if(!r||r.status!==200){SYNC.err=true;snack("No se pudo subir. Se intentará más tarde");}
  else{SYNC.err=false;SYNC.base=r.updated;SYNC.last=Date.now();if(seq===editSeq)SYNC.dirty=false;if(msg)snack(msg);}
  saveSync();refreshSync();
  if(syncAgain){syncAgain=false;syncNow(false);}
}
function syncConflict(r){
  if(!r.json)return forcePush(r.updated);
  if(SH&&!SH.isSettings)return; // se vuelve a intentar en la siguiente sincronización
  openSheet("Cambios en dos sitios",`<p class="note">Has cambiado datos aquí y también en otro dispositivo. ¿Con cuáles te quedas? Los otros se guardan en una copia en este móvil.</p>`,
    {closeLabel:"Luego",footer:`<button class="btn pri" data-a="keepLocal">Los de este móvil</button><button class="btn" data-a="keepRemote">Los del otro</button>`});
  SH.remote=r;
}
async function joinSync(text){
  const m=/(?:sync=|[?&]c=)([A-Za-z0-9]{16,64})/.exec(text||"")||/^\s*([A-Za-z0-9]{16,64})\s*$/.exec(text||"");
  if(!m)return snack("Pega el enlace entero, con #sync= al final");
  const host=/https?:\/\/([^\/\s#?]+)/i.exec(text);
  if(host&&host[1].toLowerCase()!==location.host.toLowerCase())return snack("Ese enlace es de otra web ("+host[1]+"). Ábrelo desde esa web.");
  const code=m[1];let r;
  try{r=await api(code);}catch(e){return snack("No se pudo conectar. Mira que tengas internet.");}
  SYNC={code,base:0,dirty:true};editSeq++;saveSync();
  if(r.updated>0&&r.json){
    openSheet("Ya hay datos en la nube",`<p class="note">¿Con qué datos te quedas? Los otros se guardan en una copia en este móvil.</p>`,
      {closeLabel:"Cancelar",footer:`<button class="btn pri" data-a="keepRemote">Los de la nube</button><button class="btn" data-a="keepLocal">Los de este móvil</button>`});
    SH.remote=r;SH.joining=true;
  }else{closeSheet();await forcePush(r.updated,"Sincronización activada");settingsSheet();}
}
async function createSync(){
  const code=newCode();
  try{await api(code);}catch(e){return snack("Esta web no tiene sincronización (falta sync.php) o no hay internet");}
  SYNC={code,base:0,dirty:true};editSeq++;saveSync();
  await forcePush(0,"Sincronización activada");settingsSheet();
}

   ${periodSeg()}

   <section class="sect"><h2>Exámenes</h2>${rows?`<div class="group">${rows}</div>`:`<p class="note">${S.period===ALL?"Todavía no hay exámenes de esta asignatura.":"No hay exámenes en este trimestre."}</p>`}
   ${st.equalWeights&&exs.length>1?`<p class="note">Ningún examen tiene porcentaje, así que todos cuentan lo mismo.</p>`:""}
   ${!st.equalWeights&&st.totalW>0&&Math.abs(st.totalW-100)>0.01&&S.period===ALL?`<p class="note">Los porcentajes suman ${fmtPct(st.totalW)} %.</p>`:""}</section>
   ${tasks.length?`<section class="sect"><h2>Tareas</h2><div class="group">${tasks.map(t=>upRow({k:"t",o:t})).join("")}</div></section>`:""}
   ${s.contact?`<p class="note">Contacto: <span style="user-select:all">${esc(s.contact)}</span></p>`:""}

// ---------- Horario ----------
function weekDates(){const n=new Date();let wd=n.getDay();const mon=new Date(n);mon.setDate(n.getDate()-((wd+6)%7)+(wd===6||wd===0?7:0));
  return DAY_NAMES.map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function todayIdx(){const g=new Date().getDay();return g>=1&&g<=5?g-1:-1;}
function renderHorario(){
  const wd=weekDates();if(S.day<0)S.day=Math.max(0,todayIdx());
  const di=S.day,date=iso(wd[di]),hol=holidayFor(date);
  const ti=todayIdx(),nm=new Date().getHours()*60+new Date().getMinutes(),cur=di===ti?slotAt(nm):-1;
  let body="";
  if(hol)body=`<p class="note">Festivo: ${esc(hol.name||"no hay clase")}.</p>`;
  else{
    const bl=blocks(di);
    if(!bl.length)body=`<div class="group"><button class="row plain" data-a="scrollWeek"><span class="tx"><span class="t">Aún no hay clases este día</span><span class="s">Toca una casilla de la semana completa para poner la asignatura.</span></span></button></div>`;
    else{
      const parts=[];let brkShown=false;
      for(const b of bl){
        if(!brkShown&&D.times.breakAfter>0&&b.from>=D.times.breakAfter&&D.times.breakFrom){parts.push(`<div class="brk">Recreo ${esc(D.times.breakFrom)}–${esc(D.times.breakTo)}</div>`);brkShown=true;}
        const s=subject(b.id);const now=cur>=b.from&&cur<=b.to;
        const ex=D.exams.filter(e=>e.subjectId===b.id&&e.date===date);
        const h=b.to-b.from+1;
        parts.push(`<button class="blk${now?" now":""}" data-a="subject" data-id="${b.id}" style="--c:${hex(s.color)}"><span class="bar"></span><span class="tm"><span>${esc(D.times.from[b.from])}</span><span>${esc(D.times.to[b.to])}</span></span><span class="tx"><span class="t">${esc(s.name)}</span><span class="s">${h>1?h+" horas":"1 hora"}${s.teacher?" · "+esc(s.teacher):""}</span>${ex.map(e=>`<span class="tag warn" style="align-self:flex-start;margin-top:4px">EXAMEN · ${esc(e.title)}</span>`).join("")}</span>${now?`<span class="tag" style="align-self:center;background:var(--accent);color:var(--on-accent)">AHORA</span>`:""}</button>`);
      }
      body=parts.join("");
    }
  }
  // semana completa
  let rows="";
  for(let s=0;s<slots();s++){
    if(D.times.breakAfter>0&&s===D.times.breakAfter)rows+=`<tr class="brow"><td colspan="6"></td></tr>`;
    rows+=`<tr><td class="tt">${esc(D.times.from[s])}</td>`;
    for(let d=0;d<DAYS;d++){
      if(s>=slotsFor(d)){rows+=`<td class="off"></td>`;continue;}
      const id=D.schedule[d][s],sj=id?subject(id):null;
      rows+=`<td><button class="${sj?"f":""}" ${sj?`style="--c:${hex(sj.color)}"`:""} data-a="slot" data-d="${d}" data-s="${s}" aria-label="${DAY_NAMES[d]} ${esc(D.times.from[s])}: ${sj?esc(sj.name):"libre"}">${sj?esc(abbr(sj)):"+"}</button></td>`;
    }
    rows+="</tr>";
  }
  return header("Horario",`<button class="circ" data-a="times" aria-label="Cambiar las horas">${ICON.clock}</button>`,"Semana del "+wd[0].getDate()+" de "+MON[wd[0].getMonth()])+
  `<div class="stack" style="margin-top:14px">
   <div class="days" role="group" aria-label="Día">${wd.map((d,i)=>`<button data-a="day" data-v="${i}" aria-pressed="${i===di}" class="${i===ti?"today":""}"><small>${DAY_SHORT[i]}</small><span>${d.getDate()}</span></button>`).join("")}</div>
   <section class="sect"><h2>${DAY_NAMES[di]}${di===ti?" · hoy":""}</h2>${body}</section>
   <section class="sect" id="week"><div class="sect-h"><h2>Semana completa</h2></div><div class="wk"><table><thead><tr><th class="tcol"></th>${DAY_SHORT.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Toca una casilla para cambiar la asignatura. Las horas de clase cuentan para la media ponderada si no pones tus porcentajes.</p></section></div>`;
}

// ---------- Calendario ----------
function renderCal(){
  if(!S.cal){const n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);}
  const m=S.cal,first=(m.getDay()+6)%7,start=new Date(m);start.setDate(1-first);
  const ev={};const add=(d,c)=>{(ev[d]=ev[d]||[]).push(c);};
  for(const e of D.exams)if(e.date){const s=subject(e.subjectId);add(e.date,s?hex(s.color):"var(--sub)");}
  for(const k of D.tasks)if(k.due&&!k.done)add(k.due,"var(--faint)");
  let cells=["L","M","X","J","V","S","D"].map(x=>`<span class="wd">${x}</span>`).join("");
  const t=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const id=iso(d);
    if(i>=35&&d.getMonth()!==m.getMonth())break;
    const cls=[d.getMonth()!==m.getMonth()?"out":"",holidayFor(id)?"hol":"",id===t?"td":""].join(" ");
    cells+=`<button class="${cls}" data-a="calday" data-v="${id}" aria-pressed="${id===S.calSel}" aria-label="${d.getDate()} de ${MON[d.getMonth()]}"><span>${d.getDate()}</span><span class="ds">${(ev[id]||[]).slice(0,3).map(c=>`<i style="--c:${c}"></i>`).join("")}</span></button>`;}
  const sel=S.calSel,hol=holidayFor(sel);
  const items=[];for(const e of D.exams)if(e.date===sel)items.push({k:"e",date:sel,o:e});for(const k of D.tasks)if(k.due===sel)items.push({k:"t",date:sel,o:k});
  const di=(parseIso(sel).getDay()+6)%7;
  const cls=di<5&&!hol?blocks(di).map(b=>subject(b.id)).filter(Boolean):[];
  return header("Calendario",`<button class="circ" data-a="holidays" aria-label="Festivos y vacaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M18.4 5.6 17 7M21 12h-2"/><circle cx="12" cy="13" r="4"/><path d="M4 20h16"/></svg></button>`)+
  `<div class="stack" style="margin-top:14px"><div class="cal"><div class="calh"><button class="circ" data-a="calmove" data-v="-1" aria-label="Mes anterior">${ICON.left}</button><b>${MON[m.getMonth()]} ${m.getFullYear()}</b><button class="circ" data-a="calmove" data-v="1" aria-label="Mes siguiente">${ICON.right}</button></div><div class="calg">${cells}</div></div>
  <section class="sect"><div class="sect-h"><h2 style="text-transform:capitalize">${esc(longDate(sel))}</h2><button class="link" data-a="newExamOn" data-v="${sel}">+ Examen</button></div>
  ${hol?`<p class="note" style="color:var(--warn);font-weight:600">${esc(hol.name||"Festivo")}</p>`:""}
  ${items.length?`<div class="group">${items.map(upRow).join("")}</div>`:`<p class="note">No tienes nada apuntado este día.</p>`}
  ${cls.length?`<p class="note">Clases: ${cls.map(s=>esc(s.name)).join(", ")}</p>`:""}</section></div>`;
}

// ---------- Próximos ----------
function renderProximos(){
  const t=today(),items=upcoming(0);
  const pend=D.exams.filter(e=>e.date&&e.date<t&&!(e.grade>=0)&&e.type!==SUBIR).sort((a,b)=>a.date<b.date?1:-1);
  const nodate=D.exams.filter(e=>!e.date&&!(e.grade>=0)).map(o=>({k:"e",o})).concat(D.tasks.filter(k=>!k.due&&!k.done).map(o=>({k:"t",o})));
  const done=D.tasks.filter(k=>k.done).sort((a,b)=>a.due<b.due?1:-1);
  if(!items.length&&!pend.length&&!nodate.length){
    return header("Próximos")+`<div class="empty"><span class="ic">${ICON.cal}</span><h2 style="font-size:24px">Todo despejado</h2><p>No tienes exámenes ni entregas a la vista. Cuando apuntes uno, aparecerá aquí.</p><button class="btn pri" data-a="newExam">Apuntar un examen</button><button class="link" data-a="import">Importar uno de un compañero</button></div>`;
  }
  const lim=new Date(parseIso(t));lim.setDate(lim.getDate()+7);const L=iso(lim);
  const groups=[];let g=null;
  for(const it of items){const key=it.date<L?"Esta semana":(()=>{const d=parseIso(it.date);return MON[d.getMonth()][0].toUpperCase()+MON[d.getMonth()].slice(1)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"");})();
    if(!g||g.k!==key){g={k:key,a:[]};groups.push(g);}g.a.push(it);}
  return header("Próximos")+`<div class="stack" style="margin-top:14px">
   ${groups.map(g=>`<section class="sect"><h2>${esc(g.k)}</h2><div class="group">${g.a.map(upRow).join("")}</div></section>`).join("")}
   ${pend.length?`<section class="sect"><h2>Falta poner la nota</h2><div class="group">${pend.map(o=>upRow({k:"e",o})).join("")}</div></section>`:""}
   ${nodate.length?`<section class="sect"><h2>Sin fecha</h2><div class="group">${nodate.map(upRow).join("")}</div></section>`:""}
   ${done.length?`<section class="sect"><div class="sect-h"><h2>Tareas hechas</h2><button class="link" data-a="toggleDone">${S.showDone?"Ocultar":"Ver "+done.length}</button></div>${S.showDone?`<div class="group">${done.map(o=>upRow({k:"t",o})).join("")}</div>`:""}</section>`:""}
  </div>`;
}

function renderMain(){
  if(S.detail)return renderDetail();
  return S.tab==="horario"?renderHorario():S.tab==="calendario"?renderCal():S.tab==="proximos"?renderProximos():renderInicio();
}
function render(){
  if(!D)return;
  app.innerHTML=renderMain();
  document.querySelectorAll("nav.tabs [data-a=tab]").forEach(b=>{const cur=S.detail?"inicio":S.tab;if(b.dataset.v===cur)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  updateNow();
}

// ---------- Barra "Ahora" ----------
function updateNow(){
  const el=document.getElementById("now");const di=todayIdx();const n=new Date(),m=n.getHours()*60+n.getMinutes();
  let html="";
  if(D&&di>=0&&!holidayFor(today())){
    const s=slotAt(m);
    if(s>=0&&s<slotsFor(di)&&D.schedule[di][s]){
      const b=blocks(di).find(b=>s>=b.from&&s<=b.to),sj=subject(b.id);
      const a=toMin(D.times.from[b.from]),z=toMin(D.times.to[b.to]);
      const nx=blocks(di).find(x=>x.from>b.to);const nxs=nx?subject(nx.id):null;
      html=`<span class="sq" style="--c:${hex(sj.color)}">${esc(abbr(sj))}</span><span class="tx"><span class="t">Ahora · ${esc(sj.name)}</span><span class="s">Hasta las ${esc(D.times.to[b.to])} · quedan ${Math.max(1,z-m)} min${nxs?" · luego "+esc(abbr(nxs)):""}</span></span>`;
      el.dataset.id=sj.id;
    }else if(D.times.breakFrom&&m>=toMin(D.times.breakFrom)&&m<toMin(D.times.breakTo)&&blocks(di).length){
      html=`<span class="sq" style="--c:#14B8A6;color:#04211D">☕</span><span class="tx"><span class="t">Recreo</span><span class="s">Hasta las ${esc(D.times.breakTo)}</span></span>`;el.dataset.id="";
    }
  }
  el.innerHTML=html;el.hidden=!html;app.classList.toggle("withnow",!!html);
}
setInterval(updateNow,30000);

// ======================= Hojas (formularios) =======================
let SH=null;

  document.getElementById("sheets").innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-h"><span class="grab"></span><button data-a="close">${opts.closeLabel||"Cancelar"}</button><b>${esc(title)}</b><span></span></div><div class="sh-b">${body}</div>${opts.save||opts.footer?`<div class="sh-f">${opts.save?`<button class="btn pri" data-a="sheetSave">${esc(opts.saveLabel||"Guardar")}</button>`:""}${opts.footer||""}</div>`:""}</div></div>`;

function closeSheet(){document.getElementById("sheets").innerHTML="";document.body.style.overflow="";SH=null;}
const val=id=>{const e=document.getElementById(id);return e?e.value:"";};
function sheetError(msg){let e=document.querySelector(".sh-b .err");if(!e){e=document.createElement("p");e.className="err";document.querySelector(".sh-b").prepend(e);}e.textContent=msg;e.scrollIntoView({block:"nearest"});}

let undoSnap=null,snackT=0;
function snack(msg,undo,hlId){
  const s=document.getElementById("snack");s.querySelector(".m").textContent=msg;
  const ub=s.querySelector("[data-a=undo]");ub.hidden=!undo;undoSnap=undo||null;
  s.classList.add("on");clearTimeout(snackT);snackT=setTimeout(()=>{s.classList.remove("on");undoSnap=null;},4500);
  if(hlId){S.hl=hlId;setTimeout(()=>{S.hl=0;document.querySelectorAll(".row.hl").forEach(r=>r.classList.remove("hl"));},2200);}
  try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
}
const snapshot=()=>JSON.stringify(toJson(D));
function commit(msg,snap,hl){save();closeSheet();render();if(msg)snack(msg,snap,hl);}

function subjectOptions(sel,extra){
  return D.subjects.map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${esc(s.name)}</option>`).join("")+(extra||"");
}
function trimOptions(sel){return `<option value="0"${!sel?" selected":""}>Automático (por la fecha)</option>`+D.trimesters.map(t=>`<option value="${t.id}"${t.id===sel?" selected":""}>${esc(t.name)}</option>`).join("");}

// ---------- Examen ----------
const LINK_LABEL=["","Hace media con","Sube la nota de","Recupera el"];
function examSheet(e,preset){
  const isNew=!e;
  e=e||Object.assign({id:0,subjectId:(S.detail||(D.subjects[0]||{}).id||0),title:"",date:"",topics:"",grade:-1,weight:0,type:NORMAL,linkId:0,trimId:0},preset||{});
  if(!D.subjects.length){snack("Primero crea una asignatura");return subjectSheet(null);}
  let type=e.type;
  const linkOpts=(sid)=>{
    if(type===RECU){let first=-1;const o=D.trimesters.map((t,i)=>{const g=stats(sid,t.id).beforeRecu;if(first<0&&g>=0&&g<5)first=i;return [t,g];});
      const selId=o.some(([t])=>t.id===e.linkId)?e.linkId:(o[Math.max(0,first)]||[{}])[0].id;
      return o.map(([t,g])=>`<option value="${t.id}"${t.id===selId?" selected":""}>${esc(t.name)}${g>=0?" ("+fmt1(g)+")":""}</option>`).join("");}
    const list=D.exams.filter(x=>x.subjectId===sid&&x.id!==e.id&&x.type!==SUBIR&&x.type!==RECU);
    return (type===SUBIR?`<option value="0">Nota final de la asignatura</option>`:"")+list.map(x=>`<option value="${x.id}"${x.id===e.linkId?" selected":""}>${esc(x.title||"Examen")}${x.date?" · "+rel(x.date):""}</option>`).join("");};
  const newSub=preset&&preset._newSubject?`<option value="new" selected>Nueva: ${esc(preset._newSubject)}</option>`:"";
  const body=`
  <div class="fld"><label for="f-t">Título</label><input class="in" id="f-t" value="${esc(e.title)}" placeholder="Ej. Examen tema 4" autocomplete="off"></div>
  <div class="form">
    <div class="fr"><label for="f-s">Asignatura</label><select class="in" id="f-s">${subjectOptions(newSub?-1:e.subjectId,newSub)}</select></div>
    <div class="fr"><label for="f-d">Fecha</label><input class="in" type="date" id="f-d" value="${esc(e.date)}"></div>
    <div class="fr"><label for="f-tr">Trimestre</label><select class="in" id="f-tr">${trimOptions(e.trimId)}</select></div>
    <div class="fr" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px"><span>Cómo cuenta</span><div class="radios" role="radiogroup" aria-label="Cómo cuenta">
      <button role="radio" data-a="etype" data-v="0" aria-checked="${type===0}">Normal</button><button role="radio" data-a="etype" data-v="1" aria-checked="${type===1}">Hace media con otro</button><button role="radio" data-a="etype" data-v="2" aria-checked="${type===2}">Para subir nota</button><button role="radio" data-a="etype" data-v="3" aria-checked="${type===3}">Recuperación</button></div></div>
    <div class="fr" id="r-w" ${type!==NORMAL?"hidden":""}><label for="f-w">Cuenta en la nota (%)</label><input class="in num" id="f-w" inputmode="decimal" value="${e.weight>0?fmtPct(e.weight):""}" placeholder="Ej. 30"></div>
    <div class="fr" id="r-l" ${type===NORMAL?"hidden":""}><label for="f-l" id="l-l">${LINK_LABEL[type]||""}</label><select class="in" id="f-l"></select></div>
    <div class="fr"><label for="f-g">Nota</label><input class="in num" id="f-g" inputmode="decimal" value="${e.grade>=0?fmt(e.grade):""}" placeholder="0–10"></div>
  </div>
  <p class="note" id="r-rh" ${type!==RECU?"hidden":""}>Si sacas más que la nota del trimestre, cuenta la de la recuperación, también en la media del curso.</p>
  <div class="fld"><label for="f-p">Temas que entran</label><textarea class="in" id="f-p" rows="2" placeholder="Ej. firmas digitales y certificados">${esc(e.topics)}</textarea></div>
  ${isNew?"":`<div class="btns">${e.date?`<button class="btn" data-a="calExam" data-id="${e.id}">${ICON.cal.replace('width="54" height="54"','width="20" height="20"')}Añadir al calendario</button>`:""}<button class="btn" data-a="shareExam" data-id="${e.id}">${ICON.share.replace("<svg",'<svg width="20" height="20"')}Compartir por WhatsApp</button><button class="btn dan" data-a="delExam" data-id="${e.id}">Eliminar examen</button></div>`}`;
  openSheet(isNew?"Nuevo examen":"Editar examen",body,{save:true,saveLabel:"Guardar examen",onOpen(){
    const fl=document.getElementById("f-l"),fs=document.getElementById("f-s");
    const refresh=()=>{const sid=+fs.value||0;fl.innerHTML=linkOpts(sid)||`<option value="">${type===RECU?"No hay trimestres":"No hay otros exámenes"}</option>`;};
    refresh();fs.addEventListener("change",refresh);
    SH.setType=v=>{type=v;document.querySelectorAll("[data-a=etype]").forEach(b=>b.setAttribute("aria-checked",+b.dataset.v===v));
      document.getElementById("r-w").hidden=v!==NORMAL;document.getElementById("r-l").hidden=v===NORMAL;document.getElementById("l-l").textContent=LINK_LABEL[v]||"";document.getElementById("r-rh").hidden=v!==RECU;refresh();};
    if(isNew&&!preset)setTimeout(()=>document.getElementById("f-t").focus(),250);
  },save(){
    const snap=snapshot();
    const g=num(val("f-g")),w=num(val("f-w"));
    if(g!=null&&(isNaN(g)||g<0||g>10))return sheetError("La nota tiene que ir de 0 a 10.");
    if(type===NORMAL&&w!=null&&(isNaN(w)||w<0||w>100))return sheetError("El porcentaje tiene que ir de 0 a 100.");
    let sid=val("f-s");
    if(sid==="new"){const ns={id:D.nextId++,name:preset._newSubject,color:COLORS[D.subjects.length%COLORS.length],abbr:"",teacher:"",contact:"",official:{}};D.subjects.push(ns);sid=ns.id;}
    sid=+sid;
    const link=+val("f-l")||0;
    if(type===MEDIA&&!link)return sheetError("Elige con qué examen hace media.");
    if(type===RECU&&!link)return sheetError("Primero crea los trimestres en Ajustes.");
    const o=isNew?{id:D.nextId++}:exam(e.id);
    Object.assign(o,{subjectId:sid,title:val("f-t").trim()||"Examen",date:val("f-d"),topics:val("f-p").trim(),grade:g==null?-1:g,weight:type===NORMAL&&w!=null?w:0,type,linkId:type===NORMAL?0:link,trimId:+val("f-tr")||0});
    if(isNew)D.exams.push(o);
    fixLinks();
    commit(isNew?"Examen guardado":"Cambios guardados",snap,o.id);
  }});
}
function fixLinks(){for(const e of D.exams){if(e.type===NORMAL)continue;if(e.type===RECU){if(!trim(e.linkId)){e.type=NORMAL;e.linkId=0;}continue;}const l=exam(e.linkId);if(e.linkId&&(!l||l.subjectId!==e.subjectId)){e.linkId=0;if(e.type===MEDIA)e.type=NORMAL;}}}

// ---------- Tarea ----------
function taskSheet(t,preset){
  const isNew=!t;if(!D.subjects.length){snack("Primero crea una asignatura");return subjectSheet(null);}
  t=t||Object.assign({id:0,subjectId:S.detail||D.subjects[0].id,title:"",due:"",notes:"",done:false},preset||{});
  openSheet(isNew?"Nueva tarea":"Editar tarea",`
  <div class="fld"><label for="k-t">Qué hay que entregar</label><input class="in" id="k-t" value="${esc(t.title)}" placeholder="Ej. Práctica DNS" autocomplete="off"></div>

// ---------- Simulador "¿y si...?" ----------
function withData(d,fn){const k=D;D=d;try{return fn();}finally{D=k;}}
function simSheet(sid){
  if(!D.subjects.length){snack("Primero crea una asignatura");return subjectSheet(null);}
  if(!subject(sid))sid=S.detail&&subject(S.detail)?S.detail:D.subjects[0].id;
  const typed={};
  openSheet("¿Y si...?",`<p class="note">Cambia o inventa notas y mira cómo quedarían tus medias. No se guarda nada.</p>
   <div class="form"><div class="fr"><label for="sim-s">Asignatura</label><select class="in" id="sim-s">${subjectOptions(sid)}</select></div></div>
   <div id="sim-rows"></div>
   <section class="fld"><span class="flab">Cómo quedaría</span><div class="group" id="sim-res" style="padding:4px 16px"></div></section>`,
  {closeLabel:"Cerrar",footer:`<button class="btn" data-a="simReset">Restablecer</button>`,onOpen(){
    const sel=document.getElementById("sim-s"),rows=document.getElementById("sim-rows"),res=document.getElementById("sim-res");
    const row=(n,a,b,big)=>`<div class="simr${big?" b":""}"><span class="n">${esc(n)}</span>${Math.abs(a-b)>0.005?`<span class="was">${a>=0?fmt(a):"–"} →</span>`:""}<span class="now ${b<0?"":b>=5?"ok":"ko"}">${b>=0?fmt(b):"–"}</span></div>`;
    const calc=()=>{
      const sim=normalize(JSON.parse(JSON.stringify(toJson(D))));
      for(const id in typed){const x=sim.exams.find(e=>e.id===+id);if(!x)continue;const v=num(typed[id]);if(v==null)x.grade=-1;else if(!isNaN(v)&&v>=0&&v<=10)x.grade=v;}
      const s=subject(+sel.value);if(!s)return;
      const A=stats(s.id,ALL),B=withData(sim,()=>stats(s.id,ALL));let off=A.official>=0;
      let h=row(s.name,A.finalAvg,B.finalAvg,true);
      for(const t of D.trimesters){const ta=stats(s.id,t.id);if(!ta.exams&&ta.official<0)continue;if(ta.official>=0)off=true;h+=row(t.name,ta.finalAvg,withData(sim,()=>stats(s.id,t.id)).finalAvg,false);}
      h+=row("Media del curso",overall(ALL).avg,withData(sim,()=>overall(ALL)).avg,true);
      if(off)h+=`<p class="note" style="padding:6px 0 4px;color:var(--warn)">Tienes notas del boletín puestas en esta asignatura: mandan sobre lo que simules.</p>`;
      res.innerHTML=h;
    };
    const build=()=>{
      const sid=+sel.value;const exs=D.exams.filter(e=>e.subjectId===sid).sort((a,b)=>{if(!!a.date!==!!b.date)return a.date?-1:1;return a.date<b.date?-1:a.date>b.date?1:a.id-b.id;});
      rows.innerHTML=exs.length?`<section class="fld"><span class="flab">Notas</span><div class="form">${exs.map(e=>{
        const info=(e.type===NORMAL?fmtPct(e.weight||0)+" %":e.type===MEDIA?"hace media":e.type===SUBIR?"subir nota":"recuperación")+(e.grade>=0?" · tienes un "+fmt(e.grade):" · sin nota");
        const v=typed[e.id]!=null?typed[e.id]:(e.grade>=0?fmt(e.grade):"");
        return `<div class="fr"><label for="sim-${e.id}" style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title||"Examen")}</span><span style="font-size:13px;color:var(--sub)">${esc(info)}</span></label><input class="in num" id="sim-${e.id}" data-sim="${e.id}" inputmode="decimal" value="${esc(v)}" placeholder="?"></div>`;}).join("")}</div></section>`
        :`<p class="note">Esta asignatura no tiene exámenes. Añádelos con su peso para poder simular.</p>`;
      rows.querySelectorAll("[data-sim]").forEach(i=>i.addEventListener("input",()=>{typed[i.dataset.sim]=i.value;calc();}));
      calc();
    };
    sel.addEventListener("change",build);
    SH.reset=()=>{for(const k in typed)delete typed[k];build();};
    build();
  }});
}

function timesSheet(){
  const T=D.times;
  const rows=()=>T.from.map((f,i)=>`<div class="fr"><span>${i+1}ª hora</span><input class="in" type="time" data-tf="${i}" value="${pad(Math.floor(toMin(f)/60))}:${pad(toMin(f)%60)}" style="max-width:110px;min-width:0"><span style="flex:none;color:var(--sub)">a</span><input class="in" type="time" data-tt="${i}" value="${pad(Math.floor(toMin(T.to[i])/60))}:${pad(toMin(T.to[i])%60)}" style="max-width:110px;min-width:0"></div>`).join("");
  const dur=T.from.length?toMin(T.to[0])-toMin(T.from[0]):50,brk=T.breakFrom?toMin(T.breakTo)-toMin(T.breakFrom):0;
  openSheet("Horas de clase",`
  <section class="fld"><span class="flab">Crear las horas automáticamente</span><div class="form">
   <div class="fr"><label for="g-s">Empieza a las</label><input class="in" type="time" id="g-s" value="${T.from[0]?pad(Math.floor(toMin(T.from[0])/60))+":"+pad(toMin(T.from[0])%60):"08:30"}"></div>
   <div class="fr"><label for="g-m">Minutos por clase</label><input class="in num" id="g-m" inputmode="numeric" value="${dur}"></div>
   <div class="fr"><label for="g-c">Clases al día</label><input class="in num" id="g-c" inputmode="numeric" value="${T.from.length}"></div>
   <div class="fr"><label for="g-b">Recreo después de la clase nº</label><input class="in num" id="g-b" inputmode="numeric" value="${T.breakAfter||""}" placeholder="sin"></div>
   <div class="fr"><label for="g-bm">Minutos de recreo</label><input class="in num" id="g-bm" inputmode="numeric" value="${brk||""}"></div>
  </div><button class="btn" data-a="genTimes">Crear horas</button></section>
  <section class="fld"><span class="flab">Cada hora</span><div class="form" id="t-rows">${rows()}</div></section>
  <section class="fld"><span class="flab">Clases cada día</span><div class="form">${DAY_NAMES.map((n,i)=>`<div class="fr"><label for="ds-${i}">${n}</label><input class="in num" id="ds-${i}" inputmode="numeric" value="${slotsFor(i)}"></div>`).join("")}</div></section>`,
  {save:true,saveLabel:"Guardar horas",onOpen(){SH.regen=()=>{const tmp={times:{daySlots:T.daySlots.slice()}};const c=Math.max(1,Math.min(SLOTS,+val("g-c")||T.from.length));
      generateTimes(tmp,val("g-s"),+val("g-m")||50,c,+val("g-b")||0,+val("g-bm")||0);SH.gen=tmp.times;
      document.getElementById("t-rows").innerHTML=tmp.times.from.map((f,i)=>`<div class="fr"><span>${i+1}ª hora</span><input class="in" type="time" data-tf="${i}" value="${pad(Math.floor(toMin(f)/60))}:${pad(toMin(f)%60)}" style="max-width:110px;min-width:0"><span style="flex:none;color:var(--sub)">a</span><input class="in" type="time" data-tt="${i}" value="${pad(Math.floor(toMin(tmp.times.to[i])/60))}:${pad(toMin(tmp.times.to[i])%60)}" style="max-width:110px;min-width:0"></div>`).join("");
      for(let i=0;i<DAYS;i++){const e=document.getElementById("ds-"+i);if(+e.value>c||+e.value<=0)e.value=c;}};},
   save(){
    const from=[...document.querySelectorAll("[data-tf]")].map(i=>toMin(i.value)),to=[...document.querySelectorAll("[data-tt]")].map(i=>toMin(i.value));
    for(let i=0;i<from.length;i++)if(from[i]<0||to[i]<=from[i])return sheetError("Revisa la "+(i+1)+"ª hora: tiene que terminar después de empezar.");
    const snap=snapshot();T.from=from.map(fromMin);T.to=to.map(fromMin);
    // recreo: el hueco más largo entre dos clases
    let ba=0,gap=0;for(let i=1;i<from.length;i++){const g=from[i]-to[i-1];if(g>gap&&g>=10){gap=g;ba=i;}}

   <button class="row plain" data-a="weights"><span class="tx"><span class="t">Porcentajes de la media</span><span class="s">${manualWeights()?"Tus porcentajes":"Por horas de clase"}</span></span>${chev}</button>

   <p class="note" style="padding:0">En el Android abre Ajustes, pulsa <b>Exportar copia ahora</b> y guarda el archivo en Drive o mándatelo. En el iPhone, pulsa aquí y elige ese archivo.</p>

async function exportCopy(){
  const json=JSON.stringify(toJson(D),null,1);
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(!dl)return exportLocal(json);
    await dl.save({filename:"mis-examenes-"+today()+".json",data:json});snack("Copia guardada");
  }catch(e){if(e&&e.code==="declined")return;snack("No se pudo guardar la copia");}
}

// ---------- Compartir e importar exámenes ----------
function b64url(str){const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_");}
function unb64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/").replace(/[^A-Za-z0-9+/=]/g,"");while(s.length%4)s+="=";const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function shareText(e){
  const s=subject(e.subjectId);const o={s:s?s.name:"",t:e.title,d:e.date,p:e.topics,w:e.type===NORMAL?e.weight:0};
  let m="📚 Examen"+(s?" de "+s.name:"")+": "+e.title;
  if(e.date){const l=longDate(e.date);m+="\n📅 "+l[0].toUpperCase()+l.slice(1);}
  if(e.topics&&e.topics.trim())m+="\n📖 Temas: "+e.topics.trim();
  m+="\n\nPara añadirlo a Mis Exámenes: copia este mensaje y en la app pulsa + → Importar examen.\n"+SHARE_TAG+b64url(JSON.stringify(o));
  return m;
}
function shareSheet(e){
  const txt=shareText(e);
  openSheet("Compartir examen",`<textarea class="in" id="sh-t" rows="7" readonly>${esc(txt)}</textarea>
  <p class="note">Tus compañeros con Mis Exámenes (Android o iPhone) pueden copiar el mensaje y pulsar + → Importar.</p>`,
  {closeLabel:"Cerrar",footer:`<button class="btn pri" data-a="copyShare">Copiar mensaje</button><a class="btn" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Abrir WhatsApp</a>`});
  SH.text=txt;
}
function parseShared(text){
  const i=text.indexOf(SHARE_TAG);if(i<0)return null;
  try{return JSON.parse(unb64url(text.slice(i+SHARE_TAG.length).trim().split(/\s/)[0]));}catch(e){return null;}
}
function importSheet(){
  openSheet("Importar examen",`<p class="note">Copia el mensaje que te han mandado por WhatsApp y pégalo aquí.</p>
  <textarea class="in" id="im-t" rows="6" placeholder="Mantén pulsado y elige Pegar"></textarea>`,{save:true,saveLabel:"Importar",save(){
    const o=parseShared(val("im-t"));if(!o)return sheetError("No encuentro el examen en ese texto. Copia el mensaje entero, con la línea que empieza por #MISEXAMENES.");
    const name=String(o.s||"").trim();const s=D.subjects.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
    const preset={title:String(o.t||""),date:String(o.d||""),topics:String(o.p||""),weight:+o.w||0,subjectId:s?s.id:(D.subjects[0]||{}).id};
    if(!s&&name)preset._newSubject=name;
    examSheet(null,preset);
  }});
}
function addChooser(){
  openSheet("Nuevo",`<div class="tiles"><button data-a="newExam">${ICON.exam}Examen</button><button data-a="newTask">${ICON.task}Tarea</button><button data-a="import">${ICON.imp}Importar</button></div>
  <div class="group"><button class="row plain" data-a="newSubject"><span class="tx"><span class="t">Nueva asignatura</span></span>${chev}</button></div>`);
}

// ======================= Acciones =======================
function del(list,id,msg){const snap=snapshot();const i=list.findIndex(x=>x.id===id);if(i>=0)list.splice(i,1);fixLinks();commit(msg,snap);}
const A={
  tab(el){S.tab=el.dataset.v;S.detail=0;try{localStorage.setItem("misexamenes-tab",S.tab);}catch(e){}render();window.scrollTo(0,0);},
  add(){addChooser();},
  close(){if(SH&&SH.joining){SYNC=null;saveSync();}closeSheet();},
  scrim(el,ev){if(ev.target===el)closeSheet();},
  sheetSave(){SH&&SH.save&&SH.save();},
  period(el){S.period=+el.dataset.v;render();},
  subject(el){S.detail=+el.dataset.id;render();window.scrollTo(0,0);},
  back(){S.detail=0;render();window.scrollTo(0,0);},
  weights(){weightsSheet();},
  useHours(){const snap=snapshot();D.subjects.forEach(s=>delete s.weight);commit("Ahora cuenta por horas de clase",snap);},
  settings(){settingsSheet();},
  report(){reportSheet();},
  exam(el){const e=exam(+el.dataset.id);if(e)examSheet(e);},
  newExam(el){examSheet(null,el.dataset.id?{subjectId:+el.dataset.id}:null);},
  newExamOn(el){examSheet(null,{date:el.dataset.v,subjectId:S.detail||(D.subjects[0]||{}).id});},
  etype(el){SH&&SH.setType&&SH.setType(+el.dataset.v);},
  delExam(el){del(D.exams,+el.dataset.id,"Examen eliminado");},
  shareExam(el){shareSheet(exam(+el.dataset.id));},
  copyShare(){const t=SH&&SH.text;if(!t)return;const ta=document.getElementById("sh-t");
    const fallback=()=>{ta.focus();ta.select();ta.setSelectionRange(0,t.length);snack("Texto seleccionado: pulsa Copiar");};
    try{navigator.clipboard.writeText(t).then(()=>snack("Mensaje copiado. Pégalo en WhatsApp"),fallback);}catch(e){fallback();}},
  import(){importSheet();},
  task(el){const t=D.tasks.find(x=>x.id===+el.dataset.id);if(t)taskSheet(t);},
  newTask(el){taskSheet(null,el.dataset.id?{subjectId:+el.dataset.id}:null);},
  delTask(el){del(D.tasks,+el.dataset.id,"Tarea eliminada");},
  toggleTask(el){const t=D.tasks.find(x=>x.id===+el.dataset.id);if(!t)return;const snap=snapshot();t.done=!t.done;save();render();snack(t.done?"Tarea hecha":"Tarea pendiente",snap);},
  toggleDone(){S.showDone=!S.showDone;render();},
  newSubject(){subjectSheet(null);},
  editSubject(el){subjectSheet(subject(+el.dataset.id));},
  pickColor(el){SH&&SH.setColor&&SH.setColor(el.dataset.v);},
  delSubject(el){const id=+el.dataset.id;const snap=snapshot();
    D.exams=D.exams.filter(e=>e.subjectId!==id);D.tasks=D.tasks.filter(t=>t.subjectId!==id);D.subjects=D.subjects.filter(s=>s.id!==id);
    for(const r of D.schedule)for(let i=0;i<r.length;i++)if(r[i]===id)r[i]=0;fixLinks();S.detail=0;commit("Asignatura eliminada",snap);},
  official(el){officialSheet(+el.dataset.id);},
  day(el){S.day=+el.dataset.v;render();},
  slot(el){slotSheet(+el.dataset.d,+el.dataset.s);},
  setSlot(el){const d=+el.dataset.d,s=+el.dataset.s,v=+el.dataset.v;const snap=snapshot();D.schedule[d][s]=v;
    const nx=document.getElementById("slot-next");if(nx&&nx.checked&&s+1<slotsFor(d))D.schedule[d][s+1]=v;commit("",snap);},
  scrollWeek(){const w=document.getElementById("week");w&&w.scrollIntoView({behavior:"smooth"});},
  times(){timesSheet();},
  genTimes(){SH&&SH.regen&&SH.regen();},
  calmove(el){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+(+el.dataset.v),1);render();},
  calday(el){S.calSel=el.dataset.v;const d=parseIso(S.calSel);if(d.getMonth()!==S.cal.getMonth())S.cal=new Date(d.getFullYear(),d.getMonth(),1);render();},
  holidays(){holidaysSheet();},
  delHoliday(el){const snap=snapshot();D.holidays=D.holidays.filter(h=>h.id!==+el.dataset.id);save();render();holidaysSheet();snack("Festivo quitado",snap);},
  trims(){trimSheet();},
  addTrim(){const last=D.trimesters[D.trimesters.length-1];const a=last?iso(new Date(parseIso(last.end).getTime()+864e5)):today();
    const e=new Date(parseIso(a));e.setMonth(e.getMonth()+3);addTrim(D,"Trimestre "+(D.trimesters.length+1),a,iso(e));save();trimSheet();},
  delTrim(el){const id=+el.dataset.id;const snap=snapshot();D.trimesters=D.trimesters.filter(t=>t.id!==id);
    for(const e of D.exams){if(e.trimId===id)e.trimId=0;if(e.type===RECU&&e.linkId===id){e.type=NORMAL;e.linkId=0;}}for(const s of D.subjects)delete s.official[String(id)];if(S.period===id)S.period=ALL;save();render();trimSheet();snack("Trimestre quitado",snap);},
  pickFile(){document.getElementById("filein").click();},
  export(){exportCopy();},
  undo(){if(!undoSnap)return;D=normalize(JSON.parse(undoSnap));undoSnap=null;document.getElementById("snack").classList.remove("on");save();render();},
  nowtap(el){if(el.dataset.id){S.detail=+el.dataset.id;render();window.scrollTo(0,0);}},
  sim(el){simSheet(+el.dataset.id||0);},
  simReset(){SH&&SH.reset&&SH.reset();},
  calExam(el){const e=exam(+el.dataset.id);if(e)openIcs(icsOfExam(e));},
  calAll(){openIcs({subjects:D.subjects.map(s=>({id:s.id,name:s.name})),exams:D.exams,tasks:D.tasks});},
  async calSub(){if(!SYNC)return;const h=await sha256hex(SYNC.code);location.href="webcal://"+appBase().replace(/^https?:\/\//,"")+"sync.php?ics="+h;},
  syncCreate(){createSync();},
  syncJoin(){joinSync(val("sy-in"));},
  syncNow(){syncNow(true);},
  syncCopy(){const t=syncLink();try{navigator.clipboard.writeText(t).then(()=>snack("Enlace copiado"),()=>snack("Mantén pulsado el enlace para copiarlo"));}catch(e){snack("Mantén pulsado el enlace para copiarlo");}},
  syncOff(){SYNC=null;saveSync();settingsSheet();snack("Desconectado. Tus datos siguen en este móvil");},
  keepLocal(){const r=SH&&SH.remote;if(!r)return;closeSheet();forcePush(r.updated,"Sincronizado con los datos de este móvil");},
  keepRemote(){const r=SH&&SH.remote;if(!r)return;closeSheet();applyRemote(r);}
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(!f)return;
  if(el.dataset.a==="scrim"&&ev.target!==el)return;
  f(el,ev);
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&SH)closeSheet();});
document.addEventListener("paste",ev=>{ // pegar un examen en cualquier sitio fuera de un campo
  if(SH||ev.target.closest&&ev.target.closest("input,textarea"))return;
  const t=(ev.clipboardData||{}).getData?ev.clipboardData.getData("text"):"";if(t&&t.includes(SHARE_TAG)){importSheet();setTimeout(()=>{const ta=document.getElementById("im-t");if(ta)ta.value=t;},0);}
});


// ======================= App instalable =======================
async function exportLocal(json){
  const name="mis-examenes-"+today()+".json";
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Copia de Mis Exámenes"});return snack("Copia lista");}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);snack("Copia descargada");
}
(function installable(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!document.documentElement.classList.contains("gated"))return;
  const go=document.getElementById("gate-go"),steps=document.getElementById("gate-steps"),p=document.getElementById("gate-p");
  const ua=navigator.userAgent;
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const showSteps=html=>{steps.innerHTML=html;steps.hidden=false;};
  let deferred=null;
  window.addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();deferred=ev;steps.hidden=true;go.hidden=false;});
  go.onclick=async()=>{if(!deferred)return;deferred.prompt();const r=await deferred.userChoice.catch(()=>null);deferred=null;go.hidden=true;
    if(r&&r.outcome==="accepted")done();else fallback();};
  const done=()=>{go.hidden=true;p.textContent="¡Instalada! Ábrela desde el icono de Mis Exámenes en tu pantalla de inicio.";steps.hidden=true;};
  window.addEventListener("appinstalled",done);
  // Si la app se instala y se abre, esta pestaña ya no hace falta
  const mq=window.matchMedia("(display-mode: standalone)");mq.addEventListener&&mq.addEventListener("change",e=>{if(e.matches)location.reload();});
  function fallback(){
    if(ios){
      const safari=/safari/i.test(ua)&&!/crios|fxios|edgios/i.test(ua);
      showSteps(`<ol><li>Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li><li>Abre Mis Exámenes desde el icono nuevo.</li></ol>${safari?"":"<p style=\"margin:10px 0 0;font-size:13px\">Si no ves la opción, abre este enlace en Safari.</p>"}`);
    }else{
      showSteps(`<ol><li>Abre el menú del navegador (los tres puntos).</li><li>Pulsa <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</li><li>Abre Mis Exámenes desde el icono nuevo.</li></ol><p style="margin:10px 0 0;font-size:13px">Si ya la tienes instalada, ábrela desde su icono.</p>`);
    }
  }
  if(ios)fallback();else setTimeout(()=>{if(!deferred)fallback();},2500);
})();

// ======================= Arranque =======================
(function boot(){
  const loc=readLocal();
  try{if(loc){D=normalize(JSON.parse(loc.json));lastLocal=+loc.updated||0;}}catch(e){D=null;}
  if(!D){D=newData();lastLocal=0;}
  render();
  const m=/sync=([A-Za-z0-9]{16,64})/.exec(location.hash);
  if(m){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
    if(!SYNC||SYNC.code!==m[1])setTimeout(()=>joinSync("#sync="+m[1]),300);}
  if(SYNC)syncNow(false);
})();
</script>
